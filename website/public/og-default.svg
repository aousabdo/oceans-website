<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Mariner palette: pale sky bg, deep navy ink, accent blue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF5FA"/>
      <stop offset="0.6" stop-color="#F4F9FC"/>
      <stop offset="1" stop-color="#E4EEF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#7FB8E0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7FB8E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Background wave field, very subtle -->
  <g opacity="0.16" stroke="#1A6FAB" fill="none" stroke-width="1">
    <path d="M0 480 Q 200 460 400 480 T 800 480 T 1200 480"/>
    <path d="M0 520 Q 200 500 400 520 T 800 520 T 1200 520" opacity="0.7"/>
    <path d="M0 560 Q 200 540 400 560 T 800 560 T 1200 560" opacity="0.5"/>
    <path d="M0 600 Q 200 580 400 600 T 800 600 T 1200 600" opacity="0.35"/>
  </g>

  <!-- Logo: [~] + OCEANS wordmark, top-left -->
  <g transform="translate(80 80)">
    <!-- Left bracket -->
    <path d="M 30 14 L 14 14 L 14 76 L 30 76" fill="none" stroke="#061A30" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- Right bracket -->
    <path d="M 132 14 L 148 14 L 148 76 L 132 76" fill="none" stroke="#061A30" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- Wave -->
    <path d="M 42 45 Q 62 27 81 45 T 124 45" fill="none" stroke="#061A30" stroke-width="6" stroke-linecap="round"/>
    <!-- Wordmark -->
    <text x="172" y="62" font-family="'Cormorant Garamond', 'Fraunces', Georgia, serif" font-weight="700" font-size="56" fill="#061A30" letter-spacing="0.14em">OCEANS</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="290" font-family="ui-monospace, monospace" font-size="20" fill="#1A6FAB" letter-spacing="0.22em">▌ SYSTEMS ENGINEERING · T&amp;E · MISSION DATA</text>

  <!-- Main headline (Mariner voice) -->
  <text x="80" y="380" font-family="'Cormorant Garamond', 'Fraunces', Georgia, serif" font-weight="600" font-size="78" fill="#061A30" letter-spacing="-0.01em">Depth. Discipline.</text>
  <text x="80" y="465" font-family="'Cormorant Garamond', 'Fraunces', Georgia, serif" font-weight="400" font-style="italic" font-size="78" fill="#1A6FAB" letter-spacing="-0.01em">Direction.</text>

  <!-- Footer line -->
  <line x1="80" y1="545" x2="160" y2="545" stroke="#1A6FAB" stroke-width="2"/>
  <text x="80" y="582" font-family="ui-monospace, monospace" font-size="18" fill="#4A6480" letter-spacing="0.12em">OCEANS LLC  ·  JACKSONVILLE, FL  ·  EST. 2013</text>

  <!-- Right-side decorative [~] hero element -->
  <g transform="translate(900 240)" opacity="0.55">
    <path d="M -120 -90 L -160 -90 L -160 90 L -120 90" fill="none" stroke="#1A6FAB" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
    <path d="M 120 -90 L 160 -90 L 160 90 L 120 90" fill="none" stroke="#1A6FAB" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
    <path d="M -90 0 Q -40 -56 0 0 T 90 0" fill="none" stroke="#1A6FAB" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
