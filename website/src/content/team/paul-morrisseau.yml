bio: Ocean and systems engineer with bachelor's and master's degrees from Florida Atlantic University. Serves as Chief Systems Engineer for DHS S&T's Borders and Maritime Security Division, leading enterprise architecture and agile capability integration across DHS components. Has guided multiple systems from IRAD through to Program of Record, and has served as multi-domain IT system owner on contractor engagements — bringing both the engineering rigor and the program-management discipline that move capabilities from prototype to operational fielding.
