bio: U.S. Navy veteran and co-owner of OCEANS LLC, a Service-Disabled Veteran-Owned Small Business (SDVOSB). Since founding the company in 2012, he has guided it through multiple presidential administrations and several government shutdowns while maintaining uninterrupted operations and reliable delivery for federal clients amid evolving priorities, budget constraints, and regulatory changes. Deep expertise in enterprise-level information sharing and in-situ commercial anti-piracy operations; subject-matter expert delivering secure, scalable solutions in the Maritime and Unmanned Aerial Systems (UAS) / Counter-UAS (cUAS) domains. His leadership has driven critical advancements in interoperability, data integration, and real-time information exchange for defense and homeland security stakeholders.
