bio: Specializes in C-UAS, homeland security operations, and interagency technology integration, with experience spanning program leadership, systems engineering, and operational planning. She supports federal mission partners across the Department of Homeland Security and the Department of War by developing operational frameworks, T&E models, and data-driven tools for complex mission environments. Her multidisciplinary background in governance, global security, and aviation as a pilot reflects a practical, systems-based approach to emerging security challenges.
