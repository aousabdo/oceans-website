bio: |
  Momena Ali is a Portfolio Manager with more than eight years of experience supporting the U.S. Department of Homeland Security in counter-UAS, homeland security technology, and operational systems integration. She specializes in systems engineering, operational test and evaluation (T&E), red teaming, and the transition of emerging technologies into operational use.

  Momena has designed and led operational test strategies that evaluate technology under realistic mission conditions, helping federal agencies assess performance, identify operational risks, and inform acquisition decisions. She has helped establish first-of-their-kind C-UAS test environments at Miami International Airport and Los Angeles International Airport, briefed congressional and senior executive leadership, and supported technology integration across DHS and interagency partners. Her experience spans program leadership, systems engineering, operational planning, and the deployment of mission-critical capabilities into complex operational environments.

  Momena holds a Master's degree in International Affairs from American University in Washington, D.C. She is a certified Project Management Professional (PMP), an active pilot, and participates in several international affairs and national security fellowships, bringing both operational and strategic perspectives to emerging security challenges.
