bio: |
  Michael has collaborated with the OCEANS Leadership team at DHS for more than a decade and officially joined the team in 2025. He collaborates with OCEANS Engineering teams supporting C-UAS mission operations for border security, maritime operations, and urban defense. In his role, he leads strategy and growth to increase OCEANS brand awareness, contract pursuits, and overall business development. He is a serial entrepreneur and retains more than 30 years delivering IT strategy, business intelligence, and geospatial services.

  Prior to supporting OCEANS, Michael was an Ernst & Young (EY) Technology Transformation Partner/Principal focused on delivering technology within DHS, specifically Cybersecurity & Infrastructure Security Agency (CISA) and Customs and Border Protection (CBP). Prior to being recruited by EY, Michael was a Founder & Owner of ArdentMC GIS Technology contractor responsible for scaling the business from bootstrap investment to 200+ FTE and more than $68M in annual revenue as the premier geospatial firm delivering across DHS, Military Health IT, and Federal Civilian Agencies. While leading ArdentMC's growth as Chief Growth Officer (CGO), Michael developed proven business development capture processes to win strategic sourcing contracts totaling more than $352M in prime contract awards. Prior to Ardent, his first homeland security effort was leading the design, development, and implementation of the Statue of Liberty's reservation system for its reopening after the events of 9/11. Under his leadership, he conducted safe operations for public visitors along with secure information sharing between Federal/Local law enforcement, USCG, and National Park Service.

  Michael earned his Bachelor of Science in Business Management from Washington & Lee University and is a current Board member of The George Washington University's Security in Transition MBA Program sponsored by DHS.

  Michael currently lives in South Riding, VA with his wife and two teenage children.
