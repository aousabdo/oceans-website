bio: Michael has teamed with the OCEANS Leadership team at DHS for more than a decade and officially joined the team in 2025. He collaborates with OCEANS Engineering teams supporting C-UAS mission operations for border security, maritime operations, and urban defense. In his role, he leads strategy and growth to increase OCEANS brand awareness, contract pursuits, and overall business development. He is a serial entrepreneur and brings 30+ years delivering IT strategy, business intelligence, and geospatial services for the mission.
