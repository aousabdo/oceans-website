bio: Aaron has had a front-row seat to how large organizations tackle complex technical challenges. These days, he focuses heavily on frontend development and architecture. He acts as the bridge between engineering teams and the shared component libraries they rely on, turning messy problems into clean code. His goal is always to prove that a well-built UI framework makes developers faster rather than holding them back. Currently, Aaron is applying this approach to support the Department of Homeland Security's CBP and S&T directorates, building reliable frontend tools to advance their core missions.
