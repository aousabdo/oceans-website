bio: Russ has worked in IT infrastructure administration for over 25 years, primarily in the Microsoft ecosystem. His experience spans the power sector (ICS/SCADA), higher education, banking, medical, and accounting industries, among others. With a decade in Microsoft Azure, he brings deep experience in cloud infrastructure deployments, migrations, business continuity and disaster recovery (BCDR), and network and application security — with a recent focus on data classification, data loss prevention, and AI controls.
