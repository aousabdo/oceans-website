bio: Senior Solutions Architect with more than 15 years of experience designing, implementing, and modernizing enterprise-scale software systems. Daniel supports the Department of Homeland Security's Customs and Border Protection (CBP) and Science and Technology (S&T) Directorate, applying enterprise IT architecture and cloud modernization capabilities to advance mission objectives. His background spans Retail, Fintech, and Automotive industries, where he has led the transformation of large, complex application landscapes through domain-driven design principles, microservices architectures, and robust API integrations. He leverages cloud technologies to deliver scalable, resilient solutions that improve operational efficiency and system agility. Daniel holds a degree in Management Information Systems from Ramapo College of New Jersey and maintains AWS, SAFe, and ITIL certifications.
