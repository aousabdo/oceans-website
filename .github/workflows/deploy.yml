name: Deploy
on:
  push:
    branches: [main]
  # Manual dispatch can still build any of the three themes — useful for
  # comparing alternates without changing the canonical brand.
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme to build & deploy"
        required: true
        default: "mariner"
        type: choice
        options: [mariner, operator, institute]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Determine theme
        id: theme
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "theme=${{ inputs.theme }}" >> $GITHUB_OUTPUT
          else
            # Default branch push → canonical theme (Mariner).
            echo "theme=mariner" >> $GITHUB_OUTPUT
          fi
      - name: Build
        run: PUBLIC_THEME=${{ steps.theme.outputs.theme }} npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: oceans-website
          directory: website/dist
          branch: ${{ github.ref_name }}
